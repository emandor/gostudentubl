services:
  attendance-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: gostudentubl:latest
    container_name: gostudentubl-agent
    env_file:
      - .env
    environment:
      - COPILOT_CLI=1
      - COPILOT_RUN_APP=1
      - COPILOT_CLI_BINARY_VERSION=1.0.44
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - gostudentubl-logs:/app
      - /bin/gh:/usr/local/bin/gh:ro
      - /usr/local/bin/copilot:/usr/local/bin/copilot:ro
      - /home/docker-data/gh-config:/home/app/.config/gh:ro
      - /home/docker-data/copilot-config:/home/app/.copilot
      - /root/.config/gh:/root/.config/gh:ro
    networks:
      - default
      - integration

volumes:
  gostudentubl-logs:

networks:
  integration:
    external: true
    name: ${INTEGRATION_NETWORK:-homelab_integration}
